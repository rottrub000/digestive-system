
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digestive System Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Digestive System Adventure</h1>

  <div class="food-selection">
    <div>
      <h3>Pick a Carbohydrate</h3>
      <select id="carbSelect">
        <option value="bread">Bread</option>
        <option value="apple">Apple</option>
        <option value="rice">Rice</option>
      </select>
    </div>

    <div>
      <h3>Pick a Protein</h3>
      <select id="proteinSelect">
        <option value="chicken">Chicken</option>
        <option value="eggs">Eggs</option>
        <option value="tofu">Tofu</option>
      </select>
    </div>

    <div>
      <h3>Pick a Fat</h3>
      <select id="fatSelect">
        <option value="avocado">Avocado</option>
        <option value="oliveOil">Olive Oil</option>
        <option value="cheese">Cheese</option>
      </select>
    </div>
  </div>

  <button onclick="startDigestion()">Digest!</button>

  <div id="digestionOutput"></div>

  <script src="script.js"></script>
</body>
</html>
